<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ee">
    <meta name="description" content="Avava E Ticaret Anonim Şirketi — İthalat & İhracat. Bizimle info@avava.com.tr adresinden iletişime geçebilirsiniz.">
    <link rel="canonical" href="https://www.avava.com.tr/">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>AVAVA — İthalat & İhracat</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #1c302e; background: #f5f3ee; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; padding: clamp(24px, 5vw, 72px); }
      header { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
      .dot { width: 7px; height: 7px; background: #537b65; border-radius: 50%; }
      main { flex: 1; width: 100%; max-width: 1000px; margin: auto; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 80px 0; }
      h1 { margin: 0 0 22px; font-size: clamp(76px, 19vw, 200px); font-weight: 500; letter-spacing: -.075em; line-height: .9; }
      .activity { margin: 0 0 54px; font-size: clamp(15px, 2vw, 20px); letter-spacing: .035em; }
      .contact { width: 100%; border-top: 1px solid #ced3cb; padding-top: 28px; }
      .contact p { margin: 0 0 12px; font-size: 15px; line-height: 1.7; color: #5b6762; }
      a { display: inline-flex; align-items: center; gap: 18px; color: inherit; font-size: clamp(21px, 4.8vw, 36px); text-decoration: none; padding: 5px 0; border-bottom: 1px solid #91a295; overflow-wrap: anywhere; }
      a:hover { color: #476e56; border-bottom-color: currentColor; }
      a:focus-visible { outline: 2px solid #476e56; outline-offset: 7px; border-radius: 2px; }
      a span { font-size: .8em; }
      footer { border-top: 1px solid #ced3cb; padding-top: 20px; color: #5b6762; font-size: 12px; line-height: 1.7; }
      @media (max-width: 480px) { main { padding: 70px 0; } .activity { margin-bottom: 42px; } }
    </style>
  </head>
  <body>
    <header><span class="dot" aria-hidden="true"></span> İletişim</header>
    <main>
      <h1>AVAVA</h1>
      <p class="activity">İthalat &amp; İhracat</p>
      <div class="contact">
        <p>Bizimle iletişime geçmek için mesaj atabilirsiniz.</p>
        <a href="mailto:info@avava.com.tr">info@avava.com.tr <span aria-hidden="true">↗</span></a>
      </div>
    </main>
    <footer>Avava E Ticaret Anonim Şirketi</footer>
  </body>
</html>
